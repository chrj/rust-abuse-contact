[package]
name = "abuse-contact"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Find the abuse contact for an IP address or a domain name"
repository = "https://github.com/chrj/rust-abuse-contact"
license = "MIT"
readme = "README.md"
keywords = ["abuse", "rdap", "whois", "email", "security"]
categories = ["network-programming", "email"]

[features]
default = ["http"]
# The RDAP client. Turn it off to take the readers alone, with no HTTP stack.
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
# Address ranges. The HTTP client already depends on it.
ipnet = "2"
# The body is read as text and parsed here, so the "json" feature is not needed.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Resolves names for the client, so it can drop addresses that are not public. The
# HTTP client already depends on it, so this adds no crate.
tokio = { version = "1", optional = true, default-features = false, features = ["net"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
wiremock = "0.6"

# The example makes live requests, so it needs the client.
[[example]]
name = "lookup"
required-features = ["http"]

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
