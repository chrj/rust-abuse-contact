[package]
name = "abuse-contact"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find the abuse contact for an IP address or a domain name"
repository = "https://github.com/chrj/rust-abuse-contact"
license = "MIT"
readme = "README.md"
keywords = ["abuse", "rdap", "whois", "email", "security"]
categories = ["network-programming", "email"]

[features]
default = ["http", "dns"]
# The RDAP client. Turn it off to take the readers alone, with no HTTP stack.
http = ["dep:reqwest", "dep:tokio"]
# The resolver for the Abusix and abuse.net zones. Turn it off to take the readers alone.
dns = ["dep:hickory-resolver"]

[dependencies]
# Looks up the TXT and MX records. It reads the resolver configuration of the system.
hickory-resolver = { version = "0.26", optional = true, default-features = false, features = [
    "system-config",
    "tokio",
] }
# Address ranges. The HTTP client already depends on it.
ipnet = "2"
# The body is read as text and parsed here, so the "json" feature is not needed.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Resolves names for the client, so it can drop addresses that are not public. The
# HTTP client already depends on it. "macros" lets the finder ask the sources at the
# same time. The resolver turns it on too, so with both features on it adds no crate.
tokio = { version = "1", optional = true, default-features = false, features = [
    "macros",
    "net",
] }

[dev-dependencies]
# Builds the answers of the DNS server the resolver tests start. The resolver already
# depends on it, so this adds no crate.
hickory-proto = "0.26"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
wiremock = "0.6"

# The example asks every live source, so it needs the client and the resolver.
[[example]]
name = "lookup"
required-features = ["http", "dns"]

# The example asks the live zones, so it needs the resolver.
[[example]]
name = "zones"
required-features = ["dns"]

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
