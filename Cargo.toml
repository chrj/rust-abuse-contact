[package]
name = "abuse-contact"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Find the abuse contact for an IP address or a domain name"
repository = "https://github.com/chrj/rust-abuse-contact"
license = "MIT"
readme = "README.md"
keywords = ["abuse", "rdap", "whois", "email", "security"]
categories = ["network-programming", "email"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
